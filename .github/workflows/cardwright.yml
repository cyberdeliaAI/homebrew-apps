name: Validate Cardwright cask
on:
  push:
    branches: [main]
    paths: [Casks/cardwright.rb, .github/workflows/cardwright.yml]
  pull_request:
    paths: [Casks/cardwright.rb, .github/workflows/cardwright.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cardwright:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Make candidate tap available
        run: |
          tap_parent="$(brew --repository)/Library/Taps/cyberdeliaai"
          mkdir -p "$tap_parent"
          ln -s "$GITHUB_WORKSPACE" "$tap_parent/homebrew-apps"
          if brew help trust >/dev/null 2>&1; then
            brew trust --cask cyberdeliaAI/apps/cardwright
          fi
      - name: Check cask style and audit both architectures
        run: |
          brew style Casks/cardwright.rb
          brew audit --cask --skip-style --arch all cyberdeliaAI/apps/cardwright
      - name: Install, verify signing and exercise the installed application
        shell: bash
        run: |
          brew install --cask --no-ask --appdir="$RUNNER_TEMP/cardwright-apps" cyberdeliaAI/apps/cardwright
          app="$RUNNER_TEMP/cardwright-apps/Cardwright.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
          cardwright_version="$(brew info --cask --json=v2 cyberdeliaAI/apps/cardwright | python3 -c 'import json,sys; print(json.load(sys.stdin)["casks"][0]["version"])')"
          if [[ ! "$cardwright_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          curl --fail --show-error --silent --location "https://raw.githubusercontent.com/cyberdeliaAI/Cardwright/v${cardwright_version}/tools/smoke-electron.mjs" -o "$RUNNER_TEMP/cardwright-smoke.mjs"
          node "$RUNNER_TEMP/cardwright-smoke.mjs" "$app/Contents/MacOS/Cardwright"
          brew uninstall --cask cyberdeliaAI/apps/cardwright
