name: Validate casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Make the checked-out tap available to Homebrew
        run: |
          tap_parent="$(brew --repository)/Library/Taps/cyberdeliaai"
          mkdir -p "$tap_parent"
          ln -s "$GITHUB_WORKSPACE" "$tap_parent/homebrew-apps"
      - name: Check cask style
        run: brew style Casks/*.rb
      - name: Audit both architectures
        run: |
          for cask in Casks/*.rb; do
            token="$(basename "$cask" .rb)"
            brew audit --cask --skip-style --arch all "cyberdeliaAI/apps/$token"
          done
