name: Validate casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Make the checked-out tap available to Homebrew
        run: |
          tap_parent="$(brew --repository)/Library/Taps/cyberdeliaai"
          mkdir -p "$tap_parent"
          ln -s "$GITHUB_WORKSPACE" "$tap_parent/homebrew-apps"
      - name: Check cask style
        run: brew style Casks/*.rb
      - name: Audit both architectures
        run: |
          for cask in Casks/*.rb; do
            token="$(basename "$cask" .rb)"
            brew audit --cask --skip-style --arch all "cyberdeliaAI/apps/$token"
          done
      - name: Install and check Tagcast
        shell: bash
        run: |
          brew install --cask --no-ask --appdir="$RUNNER_TEMP/apps" cyberdeliaAI/apps/tagcast
          tagcast-cli --version
          tagcast-cli --help
          export TAGCAST_HOME="$RUNNER_TEMP/tagcast-home"
          export TAGCAST_ELECTRON_PROFILE="$RUNNER_TEMP/tagcast-profile"
          export TAGCAST_ELECTRON_SMOKE_REPORT="$RUNNER_TEMP/tagcast-report.json"
          export TAGCAST_PORT=0
          mkdir -p "$TAGCAST_HOME" "$TAGCAST_ELECTRON_PROFILE"
          printf '%s\n' '{"auto_updates":false,"auto_lookup":false}' > "$TAGCAST_HOME/config.json"
          "$RUNNER_TEMP/apps/Tagcast.app/Contents/MacOS/Tagcast"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import urlopen
          report = json.loads(Path(os.environ["TAGCAST_ELECTRON_SMOKE_REPORT"]).read_text())
          assert report["ok"] and report["sandbox"] and report["contextIsolation"]
          try:
              urlopen(report["origin"] + "/api/app", timeout=1)
          except OSError:
              pass
          else:
              raise RuntimeError("Tagcast left its test server running")
          PY
          brew uninstall --cask cyberdeliaAI/apps/tagcast
      - name: Install and check Rockbox Library Manager
        shell: bash
        run: |
          brew install --cask --no-ask --appdir="$RUNNER_TEMP/apps" cyberdeliaAI/apps/rockbox-library-manager
          rockbox-library-manager --version
          rockbox-library-manager artwork --help
          rockbox-library-manager --bundle-smoke-test "$RUNNER_TEMP/cli-report.json"
          "$RUNNER_TEMP/apps/Rockbox Library Manager.app/Contents/MacOS/Rockbox Library Manager" \
            --bundle-smoke-test "$RUNNER_TEMP/gui-report.json"
          brew uninstall --cask cyberdeliaAI/apps/rockbox-library-manager
