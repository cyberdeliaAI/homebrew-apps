name: Validate casks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
    steps:
      - uses: actions/checkout@v4
      - name: Make the checked-out tap available to Homebrew
        run: |
          tap_parent="$(brew --repository)/Library/Taps/cyberdeliaai"
          mkdir -p "$tap_parent"
          ln -s "$GITHUB_WORKSPACE" "$tap_parent/homebrew-apps"
      - name: Trust only the candidate definitions on this temporary runner
        run: |
          if brew help trust >/dev/null 2>&1; then
            for cask in Casks/*.rb; do
              token="$(basename "$cask" .rb)"
              brew trust --cask "cyberdeliaAI/apps/$token"
            done
            brew trust --formula cyberdeliaAI/apps/ibfetch
          fi
      - name: Check cask style
        run: brew style Casks/*.rb Formula/*.rb
      - name: Audit both architectures
        run: |
          for cask in Casks/*.rb; do
            token="$(basename "$cask" .rb)"
            brew audit --cask --skip-style --arch all "cyberdeliaAI/apps/$token"
          done
      - name: Install and check Tagcast Lite
        shell: bash
        run: |
          token=cyberdeliaAI/apps/tagcast-lite
          brew install --cask --no-ask --appdir="$RUNNER_TEMP/apps" "$token"
          app="$RUNNER_TEMP/apps/Tagcast Lite.app"
          codesign --verify --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute "$app"
          version=$(brew info --cask --json=v2 "$token" | python3 -c 'import json, sys; print(json.load(sys.stdin)["casks"][0]["version"])')
          test "$("$app/Contents/MacOS/tagcast-player" --version)" = "tagcast-player $version"
          brew uninstall --cask "$token"
      - name: Install and check Scene Director
        shell: bash
        run: |
          export SCENE_DIRECTOR_DESKTOP_DATA_DIR="$RUNNER_TEMP/scene-director-profile"
          export SCENE_DIRECTOR_DESKTOP_SMOKE_REPORT="$RUNNER_TEMP/scene-director-report.json"
          mkdir -p "$SCENE_DIRECTOR_DESKTOP_DATA_DIR"
          printf '%s\n' '{"api_url":"http://127.0.0.1:9/v1","model":""}' > "$SCENE_DIRECTOR_DESKTOP_DATA_DIR/settings.json"
          brew install --cask --no-ask --appdir="$RUNNER_TEMP/apps" cyberdeliaAI/apps/scene-director
          codesign --verify --deep --strict "$RUNNER_TEMP/apps/Scene Director.app"
          xcrun stapler validate "$RUNNER_TEMP/apps/Scene Director.app"
          spctl --assess --type execute "$RUNNER_TEMP/apps/Scene Director.app"
          "$RUNNER_TEMP/apps/Scene Director.app/Contents/MacOS/Scene Director"
          python3 - <<'PYTHON'
          import json, os, subprocess
          from pathlib import Path
          report = json.loads(Path(os.environ["SCENE_DIRECTOR_DESKTOP_SMOKE_REPORT"]).read_text())
          assert report["ok"] and report["sandbox"] and report["contextIsolation"] and not report["nodeIntegration"]
          cask = json.loads(subprocess.check_output(["brew", "info", "--cask", "--json=v2", "cyberdeliaAI/apps/scene-director"], text=True))["casks"][0]
          assert report["version"] == cask["version"]
          log = (Path(os.environ["SCENE_DIRECTOR_DESKTOP_DATA_DIR"])/"desktop.log").read_text()
          assert "Local service exited (0)." in log
          PYTHON
          brew uninstall --cask cyberdeliaAI/apps/scene-director
      - name: Install and check Tagcast
        shell: bash
        run: |
          brew install --cask --no-ask --appdir="$RUNNER_TEMP/apps" cyberdeliaAI/apps/tagcast
          tagcast-cli --version
          tagcast-cli --help
          export TAGCAST_HOME="$RUNNER_TEMP/tagcast-home"
          export TAGCAST_ELECTRON_PROFILE="$RUNNER_TEMP/tagcast-profile"
          export TAGCAST_ELECTRON_SMOKE_REPORT="$RUNNER_TEMP/tagcast-report.json"
          export TAGCAST_PORT=0
          mkdir -p "$TAGCAST_HOME" "$TAGCAST_ELECTRON_PROFILE"
          printf '%s\n' '{"auto_updates":false,"auto_lookup":false}' > "$TAGCAST_HOME/config.json"
          "$RUNNER_TEMP/apps/Tagcast.app/Contents/MacOS/Tagcast"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from urllib.request import urlopen
          report = json.loads(Path(os.environ["TAGCAST_ELECTRON_SMOKE_REPORT"]).read_text())
          assert report["ok"] and report["sandbox"] and report["contextIsolation"]
          try:
              urlopen(report["origin"] + "/api/app", timeout=1)
          except OSError:
              pass
          else:
              raise RuntimeError("Tagcast left its test server running")
          PY
          brew uninstall --cask cyberdeliaAI/apps/tagcast
      - name: Install and check Rockbox Library Manager
        shell: bash
        run: |
          brew install --cask --no-ask --appdir="$RUNNER_TEMP/apps" cyberdeliaAI/apps/rockbox-library-manager
          rockbox-library-manager --version
          rockbox-library-manager artwork --help
          rockbox-library-manager --bundle-smoke-test "$RUNNER_TEMP/cli-report.json"
          "$RUNNER_TEMP/apps/Rockbox Library Manager.app/Contents/MacOS/Rockbox Library Manager" \
            --bundle-smoke-test "$RUNNER_TEMP/gui-report.json"
          brew uninstall --cask cyberdeliaAI/apps/rockbox-library-manager
      - name: Install and check ibfetch desktop
        shell: bash
        run: |
          export IBFETCH_HOME="$RUNNER_TEMP/ibfetch-home"
          mkdir -p "$IBFETCH_HOME"
          printf '%s\n' '{"auto_updates":false}' > "$IBFETCH_HOME/app-settings.json"
          brew install --cask --no-ask --appdir="$RUNNER_TEMP/apps" cyberdeliaAI/apps/ibfetch
          app="$RUNNER_TEMP/apps/ibfetch.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")
          test "$(ibfetch-cli --version)" = "ibfetch $version"
          ibfetch-cli get --help
          python3 - <<'PYTHON'
          from pathlib import Path
          import os, signal, subprocess, time, urllib.request

          exe = Path(os.environ["RUNNER_TEMP"]) / "apps/ibfetch.app/Contents/MacOS/ibfetch"
          with subprocess.Popen([exe], stdout=subprocess.DEVNULL) as desktop:
              try:
                  time.sleep(3)
                  assert desktop.poll() is None, "Native window exited during startup"
              finally:
                  desktop.terminate()
                  desktop.wait(timeout=10)

          with subprocess.Popen(["ibfetch-cli", "gui", "--no-browser", "--port", "0"],
                                stdout=subprocess.PIPE, text=True) as browser:
              try:
                  browser.stdout.readline()
                  url = browser.stdout.readline().strip()
                  assert url.startswith("http://127.0.0.1:")
                  with urllib.request.urlopen(url, timeout=5) as response:
                      assert "<title>ibfetch</title>" in response.read().decode()
              finally:
                  browser.send_signal(signal.SIGINT)
                  browser.wait(timeout=10)
          PYTHON
          brew uninstall --cask cyberdeliaAI/apps/ibfetch
      - name: Audit and test ibfetch formula
        shell: bash
        run: |
          export IBFETCH_HOME="$RUNNER_TEMP/ibfetch-formula-home"
          brew audit --formula --skip-style cyberdeliaAI/apps/ibfetch
          brew install --formula cyberdeliaAI/apps/ibfetch
          brew test cyberdeliaAI/apps/ibfetch
          brew uninstall --formula cyberdeliaAI/apps/ibfetch
